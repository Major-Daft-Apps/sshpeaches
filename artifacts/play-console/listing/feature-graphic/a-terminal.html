<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SSHPeaches feature graphic</title>
<style>
  :root {
    --cream: #FBEBD8;
    --orange: #E8781E;
    --ink: #2A1A10;
    --muted: #7A5A44;
    --term: #1F1A17;
  }
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: var(--cream); }
  .canvas {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background:
      radial-gradient(circle at 82% 62%, rgba(242,140,40,.22) 0, rgba(242,140,40,0) 42%),
      linear-gradient(180deg, var(--cream) 0%, #FFFFFF 100%);
    font-family: "Inter", sans-serif;
  }
  .peach {
    width: 112px; height: 112px; margin-left: -6px;
    background: var(--orange);
    -webkit-mask: url("peach-mask-hires.png") center / 150% no-repeat;
    mask: url("peach-mask-hires.png") center / 150% no-repeat;
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .wordmark {
    margin: 10px 0 0; font-weight: 900; font-size: 76px; line-height: 1;
    letter-spacing: -2.5px; color: var(--ink);
  }
  .wordmark span { color: var(--orange); }
  .tagline {
    margin: 16px 0 0; font-weight: 500; font-size: 25px; line-height: 1.3;
    color: var(--ink);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; flex-wrap: nowrap; }
  .chip {
    font-weight: 600; font-size: 15px; color: #C9610F; white-space: nowrap;
    border: 2px solid rgba(232,120,30,.45); border-radius: 999px; padding: 6px 13px;
    background: rgba(255,255,255,.45);
  }
  .term {
    position: absolute; left: 612px; top: 112px; width: 480px; height: 430px; transform: rotate(-3deg); transform-origin: 0 0;
    background: var(--term); border-radius: 22px;
    box-shadow: 0 24px 60px rgba(90,45,10,.28), 0 4px 14px rgba(90,45,10,.18);
    overflow: hidden;
  }
  .bar { height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #2B2420; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .bar .title { margin-left: 12px; font-size: 15px; font-weight: 600; color: #BFAE9F; }
  pre {
    margin: 0; padding: 20px 22px; font-family: "DejaVu Sans Mono", monospace;
    font-size: 17px; line-height: 1.62; color: #EADCCD; white-space: pre;
  }
  .p { color: #FFB07A; }
  .g { color: #7FD8BE; }
  .m { color: #9C8B7D; }
  .cursor { display: inline-block; width: 10px; height: 20px; background: #F5913B; vertical-align: -4px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="copy">
    <div class="peach"></div>
    <h1 class="wordmark">SSH<span>Peaches</span></h1>
    <p class="tagline">The friendly SSH client for Android</p>
    <div class="chips">
      <div class="chip">Terminal</div>
      <div class="chip">SFTP files</div>
      <div class="chip">SSH keys</div>
      <div class="chip">Port forwarding</div>
    </div>
  </div>
  <div class="term">
    <div class="bar">
      <div class="dot" style="background:#F28C28"></div>
      <div class="dot" style="background:#FFB07A"></div>
      <div class="dot" style="background:#FBEBD8"></div>
      <div class="title">deploy@orchard</div>
    </div>
<pre><span class="m">$</span> ssh deploy@orchard
<span class="g">Connected.</span> <span class="m">Ubuntu 24.04 LTS</span>
<span class="p">deploy@orchard:~$</span> uptime
 up 41 days,  load 0.08 0.11 0.09
<span class="p">deploy@orchard:~$</span> tmux attach
<span class="p">deploy@orchard:~$</span> <span class="cursor"></span></pre>
  </div>
</div>
</body>
</html>
